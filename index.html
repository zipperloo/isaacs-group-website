<!DOCTYPE html>
<html lang="en" data-mode="night">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISAACS Family Office</title>
    <meta name="description" content="ISAACS Family Office — a world of perspective.">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="preload" as="image" href="assets/background-night.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&display=swap" rel="stylesheet">
    <script>
        // Apply the visitor's saved mode before first paint to avoid a flash
        try {
            const saved = localStorage.getItem('isaacs-mode');
            if (saved === 'day' || saved === 'night') document.documentElement.dataset.mode = saved;
        } catch (e) {}
    </script>
    <style>
        :root {
            --espresso: #4b382d;
            --ivory: #e2d8c9;
            --fade: 1.2s ease;
            --gutter: clamp(16px, 5.5vw, 96px);
            --gutter-right: clamp(16px, 2.2vw, 48px);
            --edge: clamp(20px, 4vw, 56px);
            --label-h: clamp(18px, 1.4vw, 26px);
        }
        html[data-mode="night"] { --ink: var(--ivory); --paper: var(--espresso); }
        html[data-mode="day"] { --ink: var(--espresso); --paper: var(--ivory); }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
        }

        body {
            background: #0d0f1a;
            color: var(--ink);
            font-family: 'Jost', 'Segoe UI', sans-serif;
            font-weight: 300;
            overflow: hidden;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Background scenes */
        .scene {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: 44% center;
            transition: opacity var(--fade);
        }
        .scene-night { background-image: url('assets/background-night.jpg'); }
        .scene-day { background-image: url('assets/background-day.jpg'); }
        html[data-mode="night"] .scene-day { opacity: 0; }
        html[data-mode="day"] .scene-day { opacity: 1; }

        /* Soft shading so the type stays legible on any part of the image */
        .shade {
            position: fixed;
            inset: 0;
            pointer-events: none;
            transition: opacity var(--fade);
        }
        .shade-night {
            background:
                linear-gradient(to bottom, rgba(10, 12, 25, 0.45) 0%, transparent 22%),
                linear-gradient(to top, rgba(10, 8, 6, 0.6) 0%, transparent 28%);
        }
        .shade-day {
            background:
                linear-gradient(to bottom, rgba(255, 255, 255, 0.25) 0%, transparent 22%),
                linear-gradient(to top, rgba(240, 232, 220, 0.75) 0%, rgba(240, 232, 220, 0.35) 14%, transparent 30%);
            opacity: 0;
        }
        html[data-mode="day"] .shade-night { opacity: 0; }
        html[data-mode="day"] .shade-day { opacity: 1; }

        /* Two-tone type: an ivory and an espresso image stacked and crossfaded */
        .duo {
            position: relative;
            display: inline-block;
            line-height: 0;
        }
        .duo img {
            display: block;
            height: 100%;
            width: auto;
            transition: opacity var(--fade);
        }
        .duo img.espresso {
            position: absolute;
            inset: 0;
        }
        html[data-mode="night"] .duo img.espresso { opacity: 0; }
        html[data-mode="day"] .duo img.ivory { opacity: 0; }

        /* Layout */
        .logo {
            position: fixed;
            top: var(--edge);
            left: var(--gutter);
            width: clamp(170px, 21vw, 400px);
            margin: 0;
            z-index: 2;
        }
        .logo .duo { display: block; }
        .logo img { width: 100%; height: auto; }
        .logo .family-office {
            width: 85%;
            margin-top: 4%;
        }

        .tagline {
            position: fixed;
            left: 50%;
            bottom: clamp(36px, 6vh, 72px);
            transform: translateX(-50%);
            width: min(48vw, 900px);
            margin: 0;
            z-index: 2;
        }
        .tagline .duo, .tagline img { width: 100%; height: auto; }

        .domain {
            position: fixed;
            right: var(--gutter-right);
            bottom: var(--edge);
            height: var(--label-h);
            z-index: 2;
        }

        .label-button {
            background: none;
            border: 0;
            padding: 6px;
            margin: -6px;
            cursor: pointer;
            height: calc(var(--label-h) + 12px);
            transition: opacity 0.3s ease;
        }
        .label-button .duo,
        .mode-toggle .duo { height: var(--label-h); }
        .label-button:hover { opacity: 0.75; }
        .label-button:focus-visible,
        .mode-toggle button:focus-visible {
            outline: 1px solid var(--ink);
            outline-offset: 4px;
        }

        .contact {
            position: fixed;
            top: calc(var(--edge) * 0.6);
            right: var(--gutter-right);
            z-index: 2;
        }

        /* Day / night toggle */
        .mode-toggle {
            position: fixed;
            left: var(--gutter);
            bottom: var(--edge);
            display: flex;
            align-items: center;
            gap: 14px;
            height: var(--label-h);
            z-index: 2;
        }
        .mode-toggle .word {
            background: none;
            border: 0;
            padding: 0;
            height: 100%;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.4s ease;
        }
        html[data-mode="day"] .mode-toggle .word-day,
        html[data-mode="night"] .mode-toggle .word-night { opacity: 1; }
        .mode-toggle .word:hover { opacity: 1; }

        .switch {
            position: relative;
            width: 44px;
            height: 22px;
            padding: 0;
            border: 1px solid var(--ink);
            border-radius: 11px;
            background: transparent;
            cursor: pointer;
            transition: border-color var(--fade);
        }
        .switch::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--ink);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), background-color var(--fade);
        }
        html[data-mode="night"] .switch::after { transform: translateX(22px); }

        /* Contact dialog */
        .dialog {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(10, 8, 6, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 10;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s;
        }
        .dialog.open {
            opacity: 1;
            visibility: visible;
        }
        .panel {
            position: relative;
            width: 100%;
            max-width: 520px;
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            padding: clamp(28px, 5vw, 48px);
            background: color-mix(in srgb, var(--paper) 92%, transparent);
            color: var(--ink);
            border: 1px solid color-mix(in srgb, var(--ink) 30%, transparent);
            transform: translateY(12px);
            transition: transform 0.4s ease;
        }
        .dialog.open .panel { transform: none; }

        .panel h2 {
            margin: 0 0 28px;
            font-weight: 300;
            font-size: 1rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            text-align: center;
        }
        .close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            background: none;
            border: 0;
            color: inherit;
            font-size: 1.5rem;
            font-weight: 300;
            line-height: 1;
            cursor: pointer;
        }

        .field {
            display: block;
            margin-bottom: 20px;
        }
        .field span {
            display: block;
            margin-bottom: 6px;
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            opacity: 0.8;
        }
        .field input,
        .field textarea {
            width: 100%;
            padding: 10px 0;
            border: 0;
            border-bottom: 1px solid color-mix(in srgb, var(--ink) 45%, transparent);
            border-radius: 0;
            background: transparent;
            color: inherit;
            font: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .field textarea {
            min-height: 110px;
            resize: vertical;
        }
        .field input:focus,
        .field textarea:focus { border-bottom-color: var(--ink); }

        .submit {
            display: block;
            margin: 32px auto 0;
            padding: 14px 40px;
            background: transparent;
            color: inherit;
            border: 1px solid var(--ink);
            font: inherit;
            font-size: 0.8rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .submit:hover {
            background: var(--ink);
            color: var(--paper);
        }
        .submit:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .status {
            margin: 20px 0 0;
            min-height: 1.4em;
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            .tagline { width: 84vw; bottom: calc(var(--edge) + var(--label-h) + 28px); }
            .scene { background-position: 42% center; }
        }

        @media (prefers-reduced-motion: reduce) {
            :root { --fade: 0.01s linear; }
        }
    </style>
</head>
<body>
    <div class="scene scene-night" aria-hidden="true"></div>
    <div class="scene scene-day" aria-hidden="true"></div>
    <div class="shade shade-night" aria-hidden="true"></div>
    <div class="shade shade-day" aria-hidden="true"></div>

    <header>
        <h1 class="logo">
            <span class="sr-only">ISAACS Family Office</span>
            <span class="duo wordmark" aria-hidden="true">
                <img class="ivory" src="assets/typography/isaacs-wordmark-ivory.png" alt="">
                <img class="espresso" src="assets/typography/isaacs-wordmark-espresso.png" alt="">
            </span>
            <span class="duo family-office" aria-hidden="true">
                <img class="ivory" src="assets/typography/family-office-ivory.png" alt="">
                <img class="espresso" src="assets/typography/family-office-espresso.png" alt="">
            </span>
        </h1>

        <button class="contact label-button" id="contact-button" type="button" aria-haspopup="dialog">
            <span class="duo">
                <img class="ivory" src="assets/typography/contact-ivory.png" alt="Contact">
                <img class="espresso" src="assets/typography/contact-espresso.png" alt="" aria-hidden="true">
            </span>
        </button>
    </header>

    <main>
        <p class="tagline">
            <span class="duo">
                <img class="ivory" src="assets/typography/title-ivory.png" alt="A world of perspective">
                <img class="espresso" src="assets/typography/title-espresso.png" alt="" aria-hidden="true">
            </span>
        </p>
    </main>

    <footer>
        <div class="mode-toggle" role="group" aria-label="Background">
            <button class="word word-day" type="button" data-set-mode="day">
                <span class="duo">
                    <img class="ivory" src="assets/typography/day-ivory.png" alt="Day">
                    <img class="espresso" src="assets/typography/day-espresso.png" alt="" aria-hidden="true">
                </span>
            </button>
            <button class="switch" id="mode-switch" type="button" role="switch" aria-checked="true" aria-label="Night mode"></button>
            <button class="word word-night" type="button" data-set-mode="night">
                <span class="duo">
                    <img class="ivory" src="assets/typography/night-ivory.png" alt="Night">
                    <img class="espresso" src="assets/typography/night-espresso.png" alt="" aria-hidden="true">
                </span>
            </button>
        </div>

        <span class="domain duo">
            <img class="ivory" src="assets/typography/domain-ivory.png" alt="isaacs.group">
            <img class="espresso" src="assets/typography/domain-espresso.png" alt="" aria-hidden="true">
        </span>
    </footer>

    <!-- Contact dialog -->
    <div class="dialog" id="contact-dialog" role="dialog" aria-modal="true" aria-labelledby="contact-title">
        <div class="panel">
            <button class="close" id="contact-close" type="button" aria-label="Close">&times;</button>
            <h2 id="contact-title">Contact</h2>
            <form id="contact-form" action="https://formspree.io/f/mldqppyg" method="POST">
                <label class="field">
                    <span>Name</span>
                    <input type="text" name="name" autocomplete="name" required>
                </label>
                <label class="field">
                    <span>Email</span>
                    <input type="email" name="email" autocomplete="email" required>
                </label>
                <label class="field">
                    <span>Message</span>
                    <textarea name="message" required></textarea>
                </label>
                <button class="submit" type="submit">Send</button>
                <p class="status" id="contact-status" role="status"></p>
            </form>
        </div>
    </div>

    <script>
        const root = document.documentElement;
        const modeSwitch = document.getElementById('mode-switch');

        // Day / night toggle
        function setMode(mode) {
            root.dataset.mode = mode;
            modeSwitch.setAttribute('aria-checked', String(mode === 'night'));
            try { localStorage.setItem('isaacs-mode', mode); } catch (e) {}
        }

        modeSwitch.addEventListener('click', () => {
            setMode(root.dataset.mode === 'night' ? 'day' : 'night');
        });
        document.querySelectorAll('[data-set-mode]').forEach(button => {
            button.addEventListener('click', () => setMode(button.dataset.setMode));
        });
        modeSwitch.setAttribute('aria-checked', String(root.dataset.mode === 'night'));

        // Contact dialog
        const dialog = document.getElementById('contact-dialog');
        const contactButton = document.getElementById('contact-button');
        const closeButton = document.getElementById('contact-close');
        const contactForm = document.getElementById('contact-form');
        const status = document.getElementById('contact-status');
        const submitButton = contactForm.querySelector('.submit');

        function openDialog() {
            dialog.classList.add('open');
            contactForm.querySelector('input').focus();
        }

        function closeDialog() {
            dialog.classList.remove('open');
            contactButton.focus();
        }

        contactButton.addEventListener('click', openDialog);
        closeButton.addEventListener('click', closeDialog);
        dialog.addEventListener('click', (e) => {
            if (e.target === dialog) closeDialog();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && dialog.classList.contains('open')) closeDialog();
        });

        // Form submission via Formspree
        contactForm.addEventListener('submit', (e) => {
            e.preventDefault();
            submitButton.disabled = true;
            status.textContent = 'Sending…';

            fetch(contactForm.action, {
                method: 'POST',
                body: new FormData(contactForm),
                headers: { 'Accept': 'application/json' }
            }).then(response => {
                if (response.ok) {
                    contactForm.reset();
                    status.textContent = 'Thank you for contacting ISAACS. We will respond where there is a mutual interest.';
                } else {
                    status.textContent = 'There was an issue sending your message. Please try again.';
                }
            }).catch(() => {
                status.textContent = 'There was an issue sending your message. Please try again.';
            }).finally(() => {
                submitButton.disabled = false;
            });
        });
    </script>
</body>
</html>
