<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISAACS Family Office</title>
    <meta name="description" content="ISAACS Family Office — a world of perspective.">
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#132038">
    <link rel="preload" as="image" href="assets/background-night.jpg">
    <link rel="preload" as="image" href="assets/laptop-screen.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=Source+Sans+3:wght@200;300&display=swap" rel="stylesheet">
    <script>
        // Hold the entrance until the background is ready (scene.js removes this)
        document.documentElement.classList.add('loading');
    </script>
    <link rel="stylesheet" href="assets/site.css?v=104">
    <style>
        /* Home only; the shared layout, menu and contact form are in assets/site.css */
        body { background: #0d0f1a; color: var(--ivory); font-family: 'Jost', 'Segoe UI', sans-serif; font-weight: 300; }

        /* The entrance settles the picture from a slight zoom; the paintings crossfade over 2 seconds */
        .settle { position: absolute; inset: 0; transition: transform 7s cubic-bezier(0.16, 0.7, 0.2, 1); }
        html.loading .settle { transform: scale(1.03); transition: none; }
        .stage img { object-position: 44% 50%; }
        .stage canvas { opacity: 0; }
        .stage #screen { opacity: 1; }
        #scene-day, #scene-hw, #scene-xmas { opacity: 0; transition: opacity 2s ease; }
        #scene-day.on, #scene-hw.on, #scene-xmas.on { opacity: 1; }
        .ui { will-change: transform; }

        /* Soft shading so the type stays legible on any part of the picture (lighter by day) */
        .shade {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(to bottom, rgba(10, 12, 25, 0.45) 0%, transparent 22%),
                linear-gradient(to top, rgba(10, 8, 6, 0.6) 0%, transparent 28%);
            transition: opacity 2s ease;
        }
        .daytime .shade { opacity: 0.55; }

        /* Ivory lettering at night; by day a deep near-black brown with a faint pale halo */
        .tagline { font-family: 'Source Sans 3', sans-serif; font-weight: 200; text-shadow: 0 0 14px var(--halo), 0 0 4px var(--halo); }
        .sound, .eq i { transition: color 2s ease, background-color 2s ease, text-shadow 2s ease; }
        .daytime .logo img { filter: brightness(0.16) sepia(0.6) drop-shadow(0 0 6px rgba(255, 250, 240, 0.35)); }
        .daytime .tagline, .daytime .sound { color: var(--ink); text-shadow: 0 0 5px rgba(255, 248, 236, 0.85), 0 0 16px rgba(255, 248, 236, 0.65), 0 0 30px rgba(255, 248, 236, 0.4); }
        .daytime .tagline { font-weight: 300; }
        .daytime .eq i { background: var(--ink); box-shadow: none; }
        /* the tagline sits over the dark rug: by day it gets a soft, feathered cream glow behind it */
        .tagline::before {
            content: '';
            position: absolute;
            inset: -70% -10%;
            z-index: -1;
            background: radial-gradient(ellipse at center, rgba(250, 244, 234, 0.8) 0%, rgba(250, 244, 234, 0.62) 55%, rgba(250, 244, 234, 0) 80%);
            filter: blur(6px);
            opacity: 0;
            transition: opacity 2s ease;
            pointer-events: none;
        }
        .daytime .tagline::before { opacity: 1; }

        /* Sound toggle, bottom right */
        .sound {
            position: fixed;
            right: var(--gutter-right);
            bottom: var(--edge);
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px;
            margin: -6px;
            background: none;
            border: 0;
            color: var(--ivory);
            font: inherit;
            font-size: clamp(11px, 0.8vw, 14px);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            text-shadow: 0 0 6px var(--halo);
            cursor: pointer;
        }
        .sound:hover { opacity: 0.75; }
        .sound:disabled { opacity: 0.4; cursor: default; }
        .sound:focus-visible { outline: 1px solid currentColor; outline-offset: 4px; }
        .eq { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
        .eq i { width: 2px; height: 3px; background: var(--ivory); box-shadow: 0 0 4px var(--halo); }
        .sound[data-state="waiting"] .eq i { animation: eq-wait 1.2s ease-in-out infinite; }
        /* while sound is off, the toggle pulses gently to draw the eye */
        .sound[data-state="off"] { animation: sound-blink 2.2s ease-in-out 4s infinite; }
        .sound[data-state="off"]:hover { animation: none; }
        .sound[data-state="playing"] .eq i { animation: eq 0.9s ease-in-out infinite alternate; }
        .eq i:nth-child(2) { animation-delay: -0.3s !important; }
        .eq i:nth-child(3) { animation-delay: -0.6s !important; }
        .eq i:nth-child(4) { animation-delay: -0.15s !important; }
        @keyframes sound-blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
        @keyframes eq { 0% { height: 3px; } 50% { height: 12px; } 100% { height: 5px; } }
        @keyframes eq-wait { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.9; } }
        /* the YouTube player only provides the audio, so it is kept out of view */
        .yt-player { position: fixed; left: -10000px; top: 0; width: 200px; height: 200px; pointer-events: none; }

        /* Easter-egg notes: small and quiet, fading in beside an object */
        .egg {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 6;
            max-width: min(220px, calc(100vw - 24px));
            padding: 9px 12px 10px;
            background: color-mix(in srgb, var(--navy) 72%, transparent);
            border: 1px solid color-mix(in srgb, var(--ivory) 14%, transparent);
            color: var(--ivory);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.9s ease;
        }
        .egg.show { opacity: 0.92; }
        .egg p { margin: 0; }
        .egg-head { display: flex; align-items: baseline; gap: 6px; }
        .egg-word { font-family: 'Source Sans 3', sans-serif; font-weight: 300; font-size: 0.85rem; letter-spacing: 0.1em; }
        .egg-pos { font-size: 0.65rem; font-style: italic; opacity: 0.55; }
        .egg-def { margin-top: 4px !important; font-size: 0.68rem; line-height: 1.5; opacity: 0.75; }
        .egg-thought { font-family: 'Source Sans 3', sans-serif; font-weight: 300; font-style: italic; font-size: 0.74rem; line-height: 1.5; opacity: 0.85; }

        @media (max-width: 768px) {
            .tagline { font-weight: 300; bottom: calc(var(--edge) + 44px); }   /* ExtraLight breaks up this small */
            .stage img { object-position: 42% 50%; }
        }
        @media (prefers-reduced-motion: reduce) {
            .settle { transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="stage" id="stage" aria-hidden="true">
        <div class="settle">
            <div class="breathe">
                <img id="scene-img" src="assets/background-night.jpg" alt="">
                <img id="scene-day" alt="">
                <img id="scene-hw" alt="">
                <img id="scene-xmas" alt="">
                <canvas id="screen"></canvas>
                <canvas id="fx"></canvas>
            </div>
        </div>
    </div>
    <div class="shade" aria-hidden="true"></div>

    <div class="ui" id="ui">
        <header>
            <h1 class="logo reveal" style="--delay: 1.2s">
                <span class="sr-only">ISAACS Family Office</span>
                <img src="assets/typography/isaacs-wordmark-ivory.png?v=103" alt="" aria-hidden="true">
            </h1>
        </header>

        <main>
            <div class="layer reveal" style="--delay: 2s">
                <p class="tagline">A World of Perspective</p>
            </div>
        </main>

        <div class="layer reveal" style="--delay: 2.6s">
            <button class="sound" id="sound-toggle" type="button" aria-pressed="false" data-state="off">
                <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                <span id="sound-label">Sound off</span>
            </button>
        </div>
    </div>
    <div class="yt-player" aria-hidden="true"><div id="yt-player"></div></div>

    <div class="curtain" aria-hidden="true"></div>

    <script src="assets/scene.js?v=103"></script>
    <script src="assets/sound.js?v=103"></script>
    <script src="assets/site.js?v=103"></script>
</body>
</html>
