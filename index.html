<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISAACS Family Office</title>
    <meta name="description" content="ISAACS Family Office — a world of perspective.">
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#132038">
    <link rel="preload" as="image" href="assets/background-night.jpg">
    <link rel="preload" as="image" href="assets/laptop-screen.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=Source+Sans+3:wght@200;300&display=swap" rel="stylesheet">
    <script>
        // Hold the entrance until the background is ready (scene.js removes this)
        document.documentElement.classList.add('loading');
    </script>
    <style>
        :root {
            --espresso: #4b382d;
            --navy: #132038;
            --ivory: #e2d8c9;
            --halo: rgba(10, 8, 6, 0.55); /* soft glow behind thin type so it reads on busy parts of the image */
            --gutter: clamp(16px, 5.5vw, 96px);
            --gutter-right: clamp(16px, 2.2vw, 48px);
            --edge: clamp(20px, 4vw, 56px);
            --label-h: clamp(18px, 1.4vw, 26px);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            height: 100%;
        }

        body {
            background: #0d0f1a;
            color: var(--ivory);
            font-family: 'Jost', 'Segoe UI', sans-serif;
            font-weight: 300;
            overflow: hidden;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Background scene: the image and the effects canvas share one stage.
           scene.js sizes the stage and moves it for parallax; without JS it simply covers the screen. */
        .stage {
            position: fixed;
            inset: 0;
            overflow: hidden;
            touch-action: none;   /* swipes pan the picture instead of the page */
            will-change: transform;
        }
        .settle,
        .breathe {
            position: absolute;
            inset: 0;
            transform-origin: 50% 50%;
        }
        .stage img,
        .stage canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        .stage img {
            object-fit: cover;
            object-position: 44% 50%;
        }
        .stage canvas {
            opacity: 0;
            pointer-events: none;
        }
        .stage #screen { opacity: 1; }

        /* Entrance: fade up from black while the scene settles, then the lettering appears */
        .curtain {
            position: fixed;
            inset: 0;
            background: #000;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 2.4s ease, visibility 0s 2.4s;
            z-index: 5;
        }
        .settle { transition: transform 7s cubic-bezier(0.16, 0.7, 0.2, 1); }
        .reveal { transition: opacity 1.6s ease var(--delay, 0s), transform 1.6s cubic-bezier(0.2, 0.7, 0.2, 1) var(--delay, 0s); }
        html.loading .curtain { opacity: 1; visibility: visible; transition: none; }
        html.loading .settle { transform: scale(1.03); transition: none; }
        html.loading .reveal { opacity: 0; transform: translateY(10px); transition: none; }

        /* A barely-there, slow zoom so the scene never feels static */
        .breathe { animation: breathe 48s ease-in-out infinite alternate; }
        @keyframes breathe {
            from { transform: scale(1); }
            to { transform: scale(1.025); }
        }

        .ui {
            position: fixed;
            inset: 0;
            pointer-events: none;
            will-change: transform;
            z-index: 2;
        }
        .ui button { pointer-events: auto; }
        /* Full-screen wrappers, so the fade-in transform doesn't shift what the lettering is positioned against */
        .layer {
            position: absolute;
            inset: 0;
        }

        /* Soft shading so the type stays legible on any part of the image */
        .shade {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                linear-gradient(to bottom, rgba(10, 12, 25, 0.45) 0%, transparent 22%),
                linear-gradient(to top, rgba(10, 8, 6, 0.6) 0%, transparent 28%);
        }

        /* Layout */
        .logo {
            position: fixed;
            top: var(--edge);
            left: calc(var(--gutter) + 1.5vw);
            width: clamp(170px, 21vw, 400px);
            margin: 0;
            line-height: 0;
            z-index: 2;
        }
        .logo img {
            display: block;
            width: 100%;
            height: auto;
        }
        .logo .family-office {
            width: 85%;
            margin: 4% auto 0;
        }

        /* Same typeface as the supplied artwork, at a lighter weight to match the ISAACS wordmark */
        .tagline {
            position: fixed;
            left: 50%;
            bottom: clamp(36px, 6vh, 72px);
            transform: translateX(-50%);
            margin: 0;
            padding-left: 0.45em; /* balances the trailing letter-spacing so the line stays centred */
            font-family: 'Source Sans 3', sans-serif;
            font-weight: 200;
            font-size: clamp(14px, 2.4vw, 46px);
            letter-spacing: 0.45em;
            line-height: 1;
            text-transform: uppercase;
            text-shadow: 0 0 14px var(--halo), 0 0 4px var(--halo);
            white-space: nowrap;
            z-index: 2;
        }

        .label {
            display: block;
            height: var(--label-h);
            width: auto;
            filter: drop-shadow(0 0 2px var(--halo)) drop-shadow(0 0 8px var(--halo));
        }


        .contact {
            position: fixed;
            top: calc(var(--edge) * 0.6);
            right: var(--gutter-right);
            padding: 6px;
            margin: -6px;
            background: none;
            border: 0;
            cursor: pointer;
            transition: opacity 0.3s ease;
            z-index: 2;
        }
        .contact:hover { opacity: 0.75; }
        .contact:focus-visible,
        .sound:focus-visible {
            outline: 1px solid var(--ivory);
            outline-offset: 4px;
        }

        /* Sound toggle, bottom right */
        .sound {
            position: fixed;
            right: var(--gutter-right);
            bottom: var(--edge);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px;
            margin: -6px;
            background: none;
            border: 0;
            color: var(--ivory);
            font: inherit;
            font-size: clamp(11px, 0.8vw, 14px);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            text-shadow: 0 0 6px var(--halo);
            cursor: pointer;
            transition: opacity 0.3s ease;
            z-index: 2;
        }
        .sound:hover { opacity: 0.75; }
        .sound:disabled { opacity: 0.4; cursor: default; }
        .eq {
            display: flex;
            align-items: flex-end;
            gap: 2px;
            height: 12px;
        }
        .eq i {
            width: 2px;
            height: 3px;
            background: var(--ivory);
            box-shadow: 0 0 4px var(--halo);
            transition: height 0.4s ease;
        }
        .sound[data-state="waiting"] .eq i { animation: eq-wait 1.2s ease-in-out infinite; }
        /* While sound is off, the toggle pulses gently to draw the eye */
        .sound[data-state="off"] { animation: sound-blink 2.2s ease-in-out 4s infinite; }
        .sound[data-state="off"]:hover { animation: none; }
        @keyframes sound-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.25; }
        }
        .sound[data-state="playing"] .eq i { animation: eq 0.9s ease-in-out infinite alternate; }
        .eq i:nth-child(2) { animation-delay: -0.3s !important; }
        .eq i:nth-child(3) { animation-delay: -0.6s !important; }
        .eq i:nth-child(4) { animation-delay: -0.15s !important; }
        @keyframes eq {
            0% { height: 3px; }
            50% { height: 12px; }
            100% { height: 5px; }
        }
        @keyframes eq-wait {
            0%, 100% { opacity: 0.35; }
            50% { opacity: 0.9; }
        }
        /* The YouTube player only provides the audio, so it is kept out of view */
        .yt-player {
            position: fixed;
            left: -10000px;
            top: 0;
            width: 200px;
            height: 200px;
            pointer-events: none;
        }

        /* Easter-egg notes: small and quiet, fading in beside an object */
        .egg {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 6;
            max-width: min(220px, calc(100vw - 24px));
            padding: 9px 12px 10px;
            background: color-mix(in srgb, var(--navy) 72%, transparent);
            border: 1px solid color-mix(in srgb, var(--ivory) 14%, transparent);
            color: var(--ivory);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.9s ease;
        }
        .egg.show { opacity: 0.92; }
        .egg p { margin: 0; }
        .egg-head {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .egg-word {
            font-family: 'Source Sans 3', sans-serif;
            font-weight: 300;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
        }
        .egg-pos {
            font-size: 0.65rem;
            font-style: italic;
            opacity: 0.55;
        }
        .egg-def {
            margin-top: 4px !important;
            font-size: 0.68rem;
            line-height: 1.5;
            opacity: 0.75;
        }

        /* Contact dialog */
        .dialog {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(10, 8, 6, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 10;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s;
        }
        .dialog.open {
            opacity: 1;
            visibility: visible;
        }
        .panel {
            position: relative;
            width: 100%;
            max-width: 520px;
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            padding: clamp(28px, 5vw, 48px);
            background: color-mix(in srgb, var(--navy) 94%, transparent);
            border: 1px solid color-mix(in srgb, var(--ivory) 30%, transparent);
            transform: translateY(12px);
            transition: transform 0.4s ease;
        }
        .dialog.open .panel { transform: none; }

        /* Contact panel header: wordmark, title, then who the message goes to */
        .panel-logo {
            display: block;
            width: min(200px, 60%);
            height: auto;
            margin: 6px auto 8px;
        }
        .panel-sub {
            display: block;
            width: min(170px, 51%);   /* 85% of the wordmark, the same proportion as the main logo */
            height: auto;
            margin: 0 auto;
            opacity: 1;
        }
        .panel h2 {
            margin: 0;
            font-weight: 300;
            font-size: 0.72rem;
            letter-spacing: 0.55em;
            padding-left: 0.55em; /* balances the trailing letter-spacing */
            text-transform: uppercase;
            text-align: center;
            opacity: 0.85;
        }
        .recipient {
            margin: 0 0 36px;
            text-align: center;
        }
        .recipient::before {
            content: '';
            display: block;
            width: 36px;
            height: 1px;
            margin: 26px auto 24px;
            background: color-mix(in srgb, var(--ivory) 45%, transparent);
        }
        .recipient-name {
            display: block;
            font-family: 'Source Sans 3', sans-serif;
            font-weight: 300;
            font-size: 1.2rem;
            letter-spacing: 0.14em;
        }
        .recipient-role {
            display: block;
            margin-top: 8px;
            font-size: 0.66rem;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            opacity: 0.6;
        }
        .close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 36px;
            height: 36px;
            background: none;
            border: 0;
            color: inherit;
            font-family: 'Source Sans 3', sans-serif;
            font-size: 1.7rem;
            font-weight: 200;
            line-height: 1;
            opacity: 0.75;
            cursor: pointer;
        }

        .field {
            display: block;
            margin-bottom: 20px;
        }
        .field span {
            display: block;
            margin-bottom: 6px;
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            opacity: 0.8;
        }
        .field input,
        .field textarea {
            width: 100%;
            padding: 10px 0;
            border: 0;
            border-bottom: 1px solid color-mix(in srgb, var(--ivory) 45%, transparent);
            border-radius: 0;
            background: transparent;
            color: inherit;
            font: inherit;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s ease;
        }
        .field textarea {
            min-height: 110px;
            resize: vertical;
        }
        .field input:focus,
        .field textarea:focus { border-bottom-color: var(--ivory); }

        .submit {
            display: block;
            margin: 32px auto 0;
            padding: 14px 40px;
            background: transparent;
            color: inherit;
            border: 1px solid var(--ivory);
            font: inherit;
            font-size: 0.8rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .submit:hover {
            background: var(--ivory);
            color: var(--navy);
        }
        .submit:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        .status {
            margin: 16px 0 -8px;
            min-height: 1.4em;
            text-align: center;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            .tagline {
                font-size: 3.4vw;
                font-weight: 300; /* ExtraLight breaks up at this small size */
                letter-spacing: 0.35em;
                padding-left: 0.35em;
                bottom: calc(var(--edge) + 44px);
            }
            .stage img { object-position: 42% 50%; }
            .recipient-role { letter-spacing: 0.16em; }
        }

        /* A more compact contact panel on phones */
        @media (max-width: 600px) {
            .panel { padding: 24px 24px 22px; }
            .panel-logo { width: 156px; margin: 0 auto 7px; }
            .panel-sub { width: 133px; }
            .recipient { margin-bottom: 22px; }
            .recipient::before { margin: 16px auto 14px; }
            .recipient-name { font-size: 1.05rem; }
            .field { margin-bottom: 14px; }
            .field span { margin-bottom: 2px; }
            .field input, .field textarea { padding: 7px 0; }
            .field textarea { min-height: 72px; }
            .submit { margin-top: 20px; padding: 12px 36px; }
            .status { margin-top: 10px; }
        }

        @media (prefers-reduced-motion: reduce) {
            .settle, .reveal, .curtain { transition: none !important; }
            .breathe { animation: none; }
        }
    </style>
</head>
<body>
    <div class="stage" id="stage" aria-hidden="true">
        <div class="settle">
            <div class="breathe">
                <img id="scene-img" src="assets/background-night.jpg" alt="">
                <canvas id="screen"></canvas>
                <canvas id="fx"></canvas>
            </div>
        </div>
    </div>
    <div class="shade" aria-hidden="true"></div>

    <div class="ui" id="ui">
        <header>
            <h1 class="logo reveal" style="--delay: 1.2s">
                <span class="sr-only">ISAACS Family Office</span>
                <img src="assets/typography/isaacs-wordmark-ivory.png" alt="" aria-hidden="true">
                <img class="family-office" src="assets/typography/family-office-ivory.png" alt="" aria-hidden="true">
            </h1>

            <div class="layer reveal" style="--delay: 2.6s">
                <button class="contact" id="contact-button" type="button" aria-haspopup="dialog">
                    <img class="label" src="assets/typography/contact-ivory.png" alt="Contact">
                </button>
            </div>
        </header>

        <main>
            <div class="layer reveal" style="--delay: 2s">
                <p class="tagline">A World of Perspective</p>
            </div>
        </main>

        <div class="layer reveal" style="--delay: 2.6s">
            <button class="sound" id="sound-toggle" type="button" aria-pressed="false" data-state="off">
                <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                <span id="sound-label">Sound off</span>
            </button>
        </div>
    </div>
    <div class="yt-player" aria-hidden="true"><div id="yt-player"></div></div>

    <div class="curtain" aria-hidden="true"></div>

    <!-- Contact dialog -->
    <div class="dialog" id="contact-dialog" role="dialog" aria-modal="true" aria-labelledby="contact-title">
        <div class="panel">
            <button class="close" id="contact-close" type="button" aria-label="Close">&times;</button>
            <img class="panel-logo" src="assets/typography/isaacs-wordmark-ivory.png" alt="ISAACS">
            <img class="panel-sub" src="assets/typography/family-office-ivory.png" alt="Family Office">
            <p class="recipient">
                <span class="recipient-name" id="contact-title">Write to Helen Molyneux</span>
                <span class="recipient-role">Executive Assistant to the Principal</span>
            </p>
            <form id="contact-form" action="https://formspree.io/f/xnpjrnja" method="POST">
                <input type="hidden" name="_subject" value="Website enquiry for Helen">
                <label class="field">
                    <span>Your name</span>
                    <input type="text" name="name" autocomplete="name" required>
                </label>
                <label class="field">
                    <span>Your email</span>
                    <input type="email" name="email" autocomplete="email" required>
                </label>
                <label class="field">
                    <span>Your message</span>
                    <textarea name="message" required></textarea>
                </label>
                <button class="submit" type="submit">Send</button>
                <p class="status" id="contact-status" role="status"></p>
            </form>
        </div>
    </div>

    <script src="assets/scene.js"></script>
    <script src="assets/sound.js"></script>
    <script>
        // Contact dialog
        const dialog = document.getElementById('contact-dialog');
        const contactButton = document.getElementById('contact-button');
        const closeButton = document.getElementById('contact-close');
        const contactForm = document.getElementById('contact-form');
        const status = document.getElementById('contact-status');
        const submitButton = contactForm.querySelector('.submit');

        function openDialog() {
            dialog.classList.add('open');
            contactForm.querySelector('input').focus();
        }

        function closeDialog() {
            dialog.classList.remove('open');
            contactButton.focus();
        }

        contactButton.addEventListener('click', openDialog);
        closeButton.addEventListener('click', closeDialog);
        dialog.addEventListener('click', (e) => {
            if (e.target === dialog) closeDialog();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && dialog.classList.contains('open')) closeDialog();
        });

        // Form submission via Formspree
        contactForm.addEventListener('submit', (e) => {
            e.preventDefault();
            submitButton.disabled = true;
            status.textContent = 'Sending…';

            fetch(contactForm.action, {
                method: 'POST',
                body: new FormData(contactForm),
                headers: { 'Accept': 'application/json' }
            }).then(response => {
                if (response.ok) {
                    contactForm.reset();
                    status.textContent = 'Thank you. Helen will respond where there is a mutual interest.';
                } else {
                    status.textContent = 'There was an issue sending your message. Please try again.';
                }
            }).catch(() => {
                status.textContent = 'There was an issue sending your message. Please try again.';
            }).finally(() => {
                submitButton.disabled = false;
            });
        });
    </script>
</body>
</html>
