<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategy | ISAACS Family Office</title>
    <meta name="description" content="ISAACS Family Office — thinking in decades.">
    <link rel="icon" href="favicon.ico?v=105" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/svg+xml" href="favicon.svg?v=105">
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=105">
    <meta name="theme-color" content="#132038">
    <link rel="preload" as="image" href="assets/background-strategy.jpg?v=103">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=Source+Sans+3:wght@200;300&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
    <script>
        document.documentElement.classList.add('loading');
    </script>
    <link rel="stylesheet" href="assets/site.css?v=104">
    <style>
        /* Strategy only; the shared layout, menu and contact form are in assets/site.css */
        body { background: #f3e2c8; font-family: 'Source Sans 3', sans-serif; }
        .stage #scene-night { opacity: 0; transition: opacity 2s ease; }
        .stage #scene-night.on { opacity: 1; }

        /* Deep brown lettering by day; ivory with a soft dark halo by night */
        .logo img { filter: brightness(0.16) sepia(0.6) drop-shadow(0 0 6px rgba(255, 250, 240, 0.4)); }
        .night .logo img { filter: drop-shadow(0 0 3px rgba(10, 12, 25, 0.6)) drop-shadow(0 0 10px rgba(10, 12, 25, 0.4)); }
        .tagline { color: var(--ink); font-weight: 300; text-shadow: 0 0 5px rgba(255, 248, 236, 0.85), 0 0 16px rgba(255, 248, 236, 0.6); }
        .night .tagline { color: var(--ivory); text-shadow: 0 0 6px rgba(10, 12, 25, 0.7), 0 0 18px rgba(10, 12, 25, 0.45); }

        /* The statement: a serif headline on a feathered wash of light (no box), with the sectors
           as a short hairline list. Deep brown by day, ivory by night. */
        .statement {
            position: fixed;
            left: calc(var(--gutter) + 1.5vw);
            /* always the same breathing space below the logo, whatever the screen's shape */
            top: calc(var(--logo-bottom) + clamp(40px, 6vh, 88px));
            width: min(500px, calc(100vw - 2 * var(--gutter)));
            margin: 0;
            color: #1f1611;
            text-shadow: 0 0 1px rgba(255, 250, 242, 0.9), 0 0 12px rgba(255, 248, 236, 0.7);
            transition: color 2s ease, text-shadow 2s ease;
            z-index: 2;
        }
        .statement::before {
            content: '';
            position: absolute;
            left: -40vw;
            top: -30%;
            width: calc(100% + 60vw);
            height: 165%;
            z-index: -1;
            background: radial-gradient(ellipse at 30% 50%, rgba(252, 246, 236, 0.82) 0%, rgba(252, 246, 236, 0.6) 40%, rgba(252, 246, 236, 0) 70%);
            pointer-events: none;
            transition: opacity 2s ease;
        }
        /* the night wash sits on its own layer so the two can crossfade */
        .statement::after {
            content: '';
            position: absolute;
            left: -40vw;
            top: -30%;
            width: calc(100% + 60vw);
            height: 165%;
            z-index: -1;
            background: radial-gradient(ellipse at 30% 50%, rgba(8, 12, 28, 0.55) 0%, rgba(8, 12, 28, 0.3) 40%, rgba(8, 12, 28, 0) 68%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 2s ease;
        }
        .night .statement { color: #ece4d6; text-shadow: 0 0 1px rgba(8, 12, 28, 0.9), 0 0 12px rgba(8, 12, 28, 0.6); }
        .night .statement::before { opacity: 0; }
        .night .statement::after { opacity: 1; }
        .statement h2 {
            margin: 0;
            font-family: 'Cormorant Garamond', Georgia, serif;
            font-weight: 400;
            font-size: clamp(30px, 3.1vw, 58px);
            line-height: 1.08;
        }
        .statement h2 em { font-style: italic; }
        .statement .rule {
            width: 56px;
            height: 1px;
            margin: clamp(20px, 2.6vh, 32px) 0;
            background: currentColor;
            opacity: 0.6;
        }
        .statement p {
            max-width: 26em;
            margin: 0;
            font-weight: 400;
            font-size: clamp(14px, 1vw, 18px);
            line-height: 1.7;
            letter-spacing: 0.02em;
        }
        .statement ul {
            max-width: 22em;
            margin: clamp(18px, 2.4vh, 28px) 0 0;
            padding: 0;
            list-style: none;
            font-size: clamp(10px, 0.66vw, 12px);
            letter-spacing: 0.26em;
            line-height: 1;
            text-transform: uppercase;
        }
        .statement li {
            padding: 0.72em 0;
            border-top: 1px solid color-mix(in srgb, currentColor 22%, transparent);
        }
        .statement li:last-child { border-bottom: 1px solid color-mix(in srgb, currentColor 22%, transparent); }

        /* The day / night switch: a satin-brass rocker light switch on the marble wall. It is drawn
           flat and then skewed and foreshortened by strategy.js to sit in the wall's perspective. */
        .breaker {
            position: fixed;
            left: 0;
            top: 0;
            width: clamp(30px, 2.3vw, 42px);
            height: clamp(30px, 2.3vw, 42px);
            padding: 0;
            border: 0;
            background: none;
            cursor: pointer;
            pointer-events: auto;
            transform-origin: 0 0;
            z-index: 3;
        }
        .breaker svg { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(1.5px 2px 2px rgba(60, 40, 25, 0.35)); transition: filter 2s ease; }
        .night .breaker svg { filter: drop-shadow(1.5px 2px 2px rgba(0, 0, 0, 0.5)) brightness(0.6); }
        .breaker .rk-night { display: none; }
        .breaker[aria-pressed="true"] .rk-day { display: none; }
        .breaker[aria-pressed="true"] .rk-night { display: inline; }
        .breaker:focus-visible { outline: 1px solid #e2d8c9; outline-offset: 4px; }

        @media (max-width: 768px) {
            .tagline { bottom: calc(var(--edge) + 24px); }
            .statement { top: 17vh; width: calc(100vw - var(--gutter) - 1.5vw - 64px); }
            .statement h2 { font-size: 30px; }
        }
    </style>
</head>
<body>
    <div class="stage" id="stage" aria-hidden="true">
        <div class="breathe">
            <img id="scene-img" src="assets/background-strategy.jpg?v=103" alt="">
            <img id="scene-night" data-src="assets/background-strategy-night.jpg?v=103" alt="">
            <canvas id="fx"></canvas>
        </div>
    </div>

    <div class="ui">
        <header>
            <h1 class="logo reveal" style="--delay: 1.2s">
                <a href="./" aria-label="ISAACS Family Office, home">
                    <img src="assets/typography/isaacs-wordmark-ivory.png?v=103" alt="" aria-hidden="true">
                </a>
            </h1>
        </header>
        <main>
            <div class="layer reveal" style="--delay: 1.6s">
                <section class="statement">
                    <h2>Independent capital.<br><em>Thoughtfully deployed.</em></h2>
                    <div class="rule" aria-hidden="true"></div>
                    <p>A private family office investing globally across public markets, alternative assets and directly held businesses.</p>
                    <ul class="sectors">
                        <li>Consumer &amp; Beauty</li>
                        <li>B2B Technology &amp; Software</li>
                        <li>AI Infrastructure</li>
                        <li>Real Estate</li>
                    </ul>
                </section>
            </div>
            <div class="layer reveal" style="--delay: 2s">
                <p class="tagline">LONDON | DUBAI</p>
            </div>
        </main>
    </div>

    <button class="breaker" id="breaker" type="button" aria-pressed="false" aria-label="Switch to night">
        <svg viewBox="0 0 100 100" aria-hidden="true">
            <defs>
                <linearGradient id="sw-plate" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#cdb48c"/><stop offset="0.5" stop-color="#a88c64"/><stop offset="1" stop-color="#7d6646"/>
                </linearGradient>
                <linearGradient id="sw-up" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#d9c29c"/><stop offset="0.48" stop-color="#b89c72"/><stop offset="0.52" stop-color="#8e7452"/><stop offset="1" stop-color="#a88c64"/>
                </linearGradient>
                <linearGradient id="sw-down" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#a88c64"/><stop offset="0.48" stop-color="#8e7452"/><stop offset="0.52" stop-color="#c4ab84"/><stop offset="1" stop-color="#d9c29c"/>
                </linearGradient>
            </defs>
            <rect x="3" y="3" width="94" height="94" rx="5" fill="url(#sw-plate)"/>
            <rect x="3.6" y="3.6" width="92.8" height="92.8" rx="4.6" fill="none" stroke="rgba(255,245,225,0.45)" stroke-width="1.2"/>
            <rect x="33" y="21" width="34" height="58" rx="3" fill="#6e5a40"/>
            <rect class="rk-day" x="34.5" y="22.5" width="31" height="55" rx="2.4" fill="url(#sw-up)"/>
            <rect class="rk-night" x="34.5" y="22.5" width="31" height="55" rx="2.4" fill="url(#sw-down)"/>
        </svg>
    </button>

    <div class="curtain" aria-hidden="true"></div>
    <script src="assets/strategy.js?v=103"></script>
    <script src="assets/site.js?v=103"></script>
</body>
</html>
