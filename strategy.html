<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strategy | ISAACS Family Office</title>
    <meta name="description" content="ISAACS Family Office — thinking in decades.">
    <!-- Not linked from the site yet, so keep it out of search results -->
    <meta name="robots" content="noindex">
    <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#132038">
    <link rel="preload" as="image" href="assets/background-strategy.jpg?v=96">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@200;300&display=swap" rel="stylesheet">
    <script>document.documentElement.classList.add('loading');</script>
    <style>
        :root {
            --ink: #2a1e18;   /* the deep brown used for lettering on the bright daytime scenes */
            --gutter: clamp(16px, 5.5vw, 96px);
            --gutter-right: clamp(16px, 2.2vw, 48px);
            --edge: clamp(20px, 4vw, 56px);
            --label-h: clamp(18px, 1.4vw, 26px);
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body { background: #f3e2c8; overflow: hidden; font-family: 'Source Sans 3', sans-serif; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; }

        /* The picture and the effects canvas share one stage, sized by strategy.js to cover the screen */
        .stage { position: fixed; inset: 0; overflow: hidden; will-change: transform; }
        .breathe { position: absolute; inset: 0; animation: breathe 48s ease-in-out infinite alternate; }
        @keyframes breathe { from { transform: scale(1); } to { transform: scale(1.025); } }
        .stage img, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
        .stage img { object-fit: cover; }
        .stage canvas { pointer-events: none; }
        .stage #scene-night { opacity: 0; transition: opacity 2s ease; }
        .stage #scene-night.on { opacity: 1; }

        .curtain { position: fixed; inset: 0; background: #000; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 2.4s ease, visibility 0s 2.4s; z-index: 5; }
        .reveal { transition: opacity 1.6s ease var(--delay, 0s), transform 1.6s cubic-bezier(0.2, 0.7, 0.2, 1) var(--delay, 0s); }
        html.loading .curtain { opacity: 1; visibility: visible; transition: none; }
        html.loading .reveal { opacity: 0; transform: translateY(10px); transition: none; }

        .logo { position: fixed; top: var(--edge); left: calc(var(--gutter) + 1.5vw); width: clamp(170px, 21vw, 400px); margin: 0; line-height: 0; z-index: 2; }
        .logo a { display: block; }
        .logo img { display: block; width: 100%; height: auto; }
        .logo .family-office { width: 85%; margin: 4% auto 0; }
        .logo img, .label { filter: brightness(0.16) sepia(0.6) drop-shadow(0 0 6px rgba(255, 250, 240, 0.4)); }

        .contact { position: fixed; top: calc(var(--edge) * 0.6); right: var(--gutter-right); padding: 6px; margin: -6px; z-index: 2; transition: opacity 0.3s ease; }
        .contact:hover { opacity: 0.75; }
        .label { display: block; height: var(--label-h); width: auto; }

        .tagline {
            position: fixed; left: 50%; bottom: clamp(36px, 6vh, 72px); transform: translateX(-50%); margin: 0;
            padding-left: 0.45em; color: var(--ink);
            font-weight: 300; font-size: clamp(14px, 2.4vw, 46px); letter-spacing: 0.45em; line-height: 1;
            text-transform: uppercase; white-space: nowrap; z-index: 2;
            text-shadow: 0 0 5px rgba(255, 248, 236, 0.85), 0 0 16px rgba(255, 248, 236, 0.6);
        }
        .layer { position: absolute; inset: 0; }

        /* The statement: a small, quiet block in the open sky, centred */
        .statement {
            position: fixed;
            left: calc(var(--gutter) + 1.5vw);
            top: 22vh;
            width: min(560px, calc(100vw - 2 * var(--gutter)));
            margin: 0;
            text-align: left;
            color: var(--ink);
            text-shadow: none;
            /* a soft, frosted panel behind the text: warm ivory by day, deep navy by night */
            padding: clamp(24px, 2.6vw, 40px) clamp(26px, 2.8vw, 44px);
            margin-left: calc(-1 * clamp(26px, 2.8vw, 44px));
            background: rgba(252, 246, 236, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.45);
            border-radius: 2px;
            box-shadow: 0 18px 50px rgba(60, 40, 20, 0.12);
            backdrop-filter: blur(10px) saturate(1.1);
            -webkit-backdrop-filter: blur(10px) saturate(1.1);
            transition: color 2s ease, background-color 2s ease, border-color 2s ease, box-shadow 2s ease;
            z-index: 2;
        }
        .statement h2 {
            margin: 0;
            font-weight: 300;
            font-size: clamp(20px, 1.9vw, 34px);
            line-height: 1.3;
            letter-spacing: 0.03em;
        }
        .statement .rule {
            width: 40px;
            height: 1px;
            margin: clamp(18px, 2.2vh, 28px) 0;
            background: currentColor;
            opacity: 0.45;
        }
        .statement p {
            max-width: 30em;
            margin: 0;
            font-weight: 300;
            font-size: clamp(13px, 0.95vw, 17px);
            line-height: 1.7;
            letter-spacing: 0.02em;
            opacity: 0.92;
        }
        .statement .sectors {
            margin-top: clamp(16px, 2.2vh, 24px);
            padding-top: clamp(14px, 2vh, 20px);
            border-top: 1px solid currentColor;
            border-top-color: color-mix(in srgb, currentColor 18%, transparent);
            font-size: clamp(10px, 0.68vw, 12px);
            letter-spacing: 0.24em;
            text-transform: uppercase;
            opacity: 0.75;
        }
        .statement .sectors span { white-space: nowrap; }
        .statement .sectors b { font-weight: inherit; }
        /* wide screens: Consumer · B2B · Data Centres / Real Estate · AI Software;
           phones: Consumer · B2B / Data Centres / Real Estate · AI Software */
        .statement .brk { display: inline; }
        .statement .brk-wide { display: none; }
        @media (max-width: 768px) {
            .statement .brk { display: none; }
            .statement .brk-wide { display: inline; }
        }
        .statement .sectors { max-width: none; line-height: 2.1; }
        .statement .sectors i { font-style: normal; margin: 0 0.35em; opacity: 0.6; }

        /* Night: the lettering turns ivory with a soft dark halo */
        .logo img, .label, .tagline { transition: filter 2s ease, color 2s ease, text-shadow 2s ease; }
        .night .logo img, .night .label { filter: drop-shadow(0 0 3px rgba(10, 12, 25, 0.6)) drop-shadow(0 0 10px rgba(10, 12, 25, 0.4)); }
        .night .tagline { color: #e2d8c9; text-shadow: 0 0 6px rgba(10, 12, 25, 0.7), 0 0 18px rgba(10, 12, 25, 0.45); }
        .night .statement { color: #e2d8c9; background: rgba(12, 18, 36, 0.42); border-color: rgba(226, 216, 201, 0.14); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.3); }

        /* The day / night switch: a satin-brass rocker light switch on the marble wall. It is drawn
           flat and then skewed and foreshortened by strategy.js to sit in the wall's perspective. */
        .breaker {
            position: fixed;
            left: 0;
            top: 0;
            width: clamp(30px, 2.3vw, 42px);
            height: clamp(30px, 2.3vw, 42px);
            padding: 0;
            border: 0;
            background: none;
            cursor: pointer;
            pointer-events: auto;
            transform-origin: 0 0;
            z-index: 3;
        }
        .breaker svg { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(1.5px 2px 2px rgba(60, 40, 25, 0.35)); transition: filter 2s ease; }
        .night .breaker svg { filter: drop-shadow(1.5px 2px 2px rgba(0, 0, 0, 0.5)) brightness(0.6); }
        .breaker .rk-night { display: none; }
        .breaker[aria-pressed="true"] .rk-day { display: none; }
        .breaker[aria-pressed="true"] .rk-night { display: inline; }
        .breaker:focus-visible { outline: 1px solid #e2d8c9; outline-offset: 4px; }
        .ui { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
        .ui a { pointer-events: auto; }

        @media (max-width: 768px) {
            .tagline { font-size: 3.4vw; letter-spacing: 0.35em; padding-left: 0.35em; bottom: calc(var(--edge) + 24px); }
            .statement { top: 17vh; margin-left: 0; width: calc(100vw - var(--gutter) - 1.5vw - 64px); padding: 20px 20px; }
            .statement .sectors { font-size: 10px; letter-spacing: 0.14em; }
            .statement .sectors { letter-spacing: 0.14em; }
        }
        @media (prefers-reduced-motion: reduce) {
            .breathe { animation: none; }
            .reveal, .curtain { transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="stage" id="stage" aria-hidden="true">
        <div class="breathe">
            <img id="scene-img" src="assets/background-strategy.jpg?v=96" alt="">
            <img id="scene-night" data-src="assets/background-strategy-night.jpg?v=96" alt="">
            <canvas id="fx"></canvas>
        </div>
    </div>

    <div class="ui">
        <header>
            <h1 class="logo reveal" style="--delay: 1.2s">
                <a href="./" aria-label="ISAACS Family Office, home">
                    <img src="assets/typography/isaacs-wordmark-ivory.png" alt="" aria-hidden="true">
                    <img class="family-office" src="assets/typography/family-office-ivory.png" alt="" aria-hidden="true">
                </a>
            </h1>
            <div class="layer reveal" style="--delay: 2.6s">
                <a class="contact" href="./#contact">
                    <img class="label" src="assets/typography/contact-ivory.png" alt="Contact">
                </a>
            </div>
        </header>
        <main>
            <div class="layer reveal" style="--delay: 1.6s">
                <section class="statement">
                    <h2>Independent capital.<br>A long-term perspective.</h2>
                    <div class="rule" aria-hidden="true"></div>
                    <p>A private family office investing globally across public markets, alternative assets and directly held businesses.</p>
                    <p class="sectors"><span>Consumer &amp; Beauty</span><i>·</i><span>B2B Technology</span><b class="brk"><i>·</i></b><br class="brk-wide"><span>Data Centres</span><br class="brk-narrow"><span>Real Estate</span><i>·</i><span>AI Software</span></p>
                </section>
            </div>
            <div class="layer reveal" style="--delay: 2s">
                <p class="tagline">Thinking in Decades</p>
            </div>
        </main>
    </div>

    <button class="breaker" id="breaker" type="button" aria-pressed="false" aria-label="Switch to night">
        <svg viewBox="0 0 100 100" aria-hidden="true">
            <defs>
                <linearGradient id="sw-plate" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0" stop-color="#cdb48c"/><stop offset="0.5" stop-color="#a88c64"/><stop offset="1" stop-color="#7d6646"/>
                </linearGradient>
                <linearGradient id="sw-up" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#d9c29c"/><stop offset="0.48" stop-color="#b89c72"/><stop offset="0.52" stop-color="#8e7452"/><stop offset="1" stop-color="#a88c64"/>
                </linearGradient>
                <linearGradient id="sw-down" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#a88c64"/><stop offset="0.48" stop-color="#8e7452"/><stop offset="0.52" stop-color="#c4ab84"/><stop offset="1" stop-color="#d9c29c"/>
                </linearGradient>
            </defs>
            <rect x="3" y="3" width="94" height="94" rx="5" fill="url(#sw-plate)"/>
            <rect x="3.6" y="3.6" width="92.8" height="92.8" rx="4.6" fill="none" stroke="rgba(255,245,225,0.45)" stroke-width="1.2"/>
            <rect x="33" y="21" width="34" height="58" rx="3" fill="#6e5a40"/>
            <rect class="rk-day" x="34.5" y="22.5" width="31" height="55" rx="2.4" fill="url(#sw-up)"/>
            <rect class="rk-night" x="34.5" y="22.5" width="31" height="55" rx="2.4" fill="url(#sw-down)"/>
        </svg>
    </button>

    <div class="curtain" aria-hidden="true"></div>
    <script src="assets/strategy.js?v=96"></script>
</body>
</html>
